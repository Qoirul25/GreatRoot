<style>
/* tokens */
:root{
  --c-bg:#14100B; --c-bg2:#1E1710; --c-surface:#241C13;
  --c-text:#F4EAD9; --c-muted:#A89880;
  --c-gold:#F2B843; --c-chili:#E4572E; --c-ember:#FF7A3D; --c-leaf:#8FB573;
  --c-line:rgba(244,234,217,.14);
  --f-display:'Anton',Impact,system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --s-xs:.25rem; --s-sm:.5rem; --s-md:1rem; --s-lg:2rem; --s-xl:4rem;
  --r-sm:.5rem; --r-md:1rem; --r-full:9999px;
  --sh-md:0 8px 24px rgba(0,0,0,.4); --sh-lg:0 30px 80px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--c-bg)}
body{color:var(--c-text);font-family:var(--f-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
::selection{background:var(--c-gold);color:#1c130a}
:focus-visible{outline:2px solid var(--c-gold);outline-offset:3px}

/* runway */
.runway{pointer-events:none}

/* stage + world */
.stage{position:fixed;inset:0;z-index:1;perspective:1000px;perspective-origin:50% 42%;overflow:hidden}
.world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.floor{position:absolute;left:50%;bottom:0;width:300vw;height:10000px;
  transform:translateX(-50%) translateZ(1000px) rotateX(90deg);transform-origin:50% 100%;
  backface-visibility:hidden;pointer-events:none;
  background:
    repeating-linear-gradient(to top,rgba(242,184,67,.13) 0 2px,transparent 2px 220px),
    repeating-linear-gradient(to right,rgba(242,184,67,.05) 0 2px,transparent 2px 280px);
  -webkit-mask-image:linear-gradient(to top,transparent 0,#000 6%,#000 55%,transparent 92%);
  mask-image:linear-gradient(to top,transparent 0,#000 6%,#000 55%,transparent 92%);
}

/* gapura entry */
.gate{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.g-pillar{position:absolute;top:6%;bottom:-30%;width:clamp(48px,6vw,84px);
  background:linear-gradient(90deg,#2a1d12,#3d2a18 45%,#241811);
  border:1px solid rgba(242,184,67,.25);box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.g-pillar.l{left:11%}.g-pillar.r{right:11%}
.g-pillar::after{content:"";position:absolute;left:0;right:0;top:18%;height:14px;background:var(--c-gold);opacity:.85;box-shadow:0 0 18px rgba(242,184,67,.6)}
.g-beam{position:absolute;left:6%;right:6%;top:6%;height:clamp(40px,5.5vw,64px);
  background:linear-gradient(180deg,#3d2a18,#241811);border:1px solid rgba(242,184,67,.3);
  border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.g-beam.b2{top:calc(6% + clamp(40px,5.5vw,64px) + 14px);height:12px;left:9%;right:9%}
.g-sign{position:absolute;left:50%;top:calc(6% + clamp(40px,5.5vw,64px));transform:translateX(-50%);
  writing-mode:vertical-rl;font-family:var(--f-display);color:var(--c-gold);background:#1c130a;
  border:1px solid rgba(242,184,67,.4);padding:1rem .5rem;letter-spacing:.3em;font-size:1.05rem;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
.g-sign::before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:14px;background:rgba(242,184,67,.5)}
.g-lan{position:absolute;top:calc(6% + clamp(40px,5.5vw,64px) + 22px);width:34px;height:44px;border-radius:50%/45%;
  background:radial-gradient(circle at 35% 30%,#ffd98a,#e4572e 60%,#a33318);
  box-shadow:0 0 30px rgba(228,87,46,.7);transform-origin:50% -20px;
  animation:sway 3.5s ease-in-out infinite,flick 2.2s ease-in-out infinite}
.g-lan.l{left:22%}.g-lan.r{right:22%;animation-delay:-1.7s,-1.1s}
.g-lan::before{content:"";position:absolute;left:50%;top:-20px;width:1px;height:20px;background:rgba(242,184,67,.5)}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes flick{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

/* cincin transisi */
.ring{position:absolute;left:50%;top:46%;width:min(72vw,720px);height:min(64vh,520px);
  border:2px solid var(--rc,#F2B843);border-radius:300px 300px 20px 20px;pointer-events:none;
  box-shadow:0 0 40px color-mix(in srgb,var(--rc) 40%,transparent),inset 0 0 40px color-mix(in srgb,var(--rc) 25%,transparent)}
.ring::after{content:"";position:absolute;inset:14px;border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);border-radius:inherit}

/* scene */
.scene{position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d;will-change:opacity;visibility:hidden}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-style:preserve-3d;pointer-events:none}
.l-back{transform:translateZ(-320px) scale(1.35)}
.l-mid{transform:translateZ(0);pointer-events:auto;gap:2.5rem}
.l-front{transform:translateZ(260px) scale(.76)}

/* back layer */
.glow{position:absolute;width:65vmax;height:65vmax;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 20%,transparent),transparent 65%)}
.ghost{position:relative;font-family:var(--f-display);font-size:clamp(9rem,26vw,22rem);line-height:1;
  text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--acc) 50%,transparent);
  user-select:none}

/* mid content */
.mid{position:relative;width:min(1100px,92vw);display:grid;grid-template-columns:1.05fr .95fr;gap:4rem;align-items:center}
.alt .mid{direction:rtl}
.alt .mid>*{direction:ltr}
.zone{display:flex;align-items:center;gap:.75rem;font:600 .75rem/1 var(--f-body);letter-spacing:.35em;text-transform:uppercase;color:var(--acc)}
.zone::before{content:"";width:2.5rem;height:1px;background:var(--acc)}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(3rem,8vw,6.5rem);line-height:.95;text-transform:uppercase;margin:1.25rem 0 1.5rem}
.title em{font-style:normal;color:var(--acc)}
.sub{color:var(--c-muted);font-size:1.0625rem;line-height:1.65;max-width:36ch}

/* visual */
.visual{position:relative;display:flex;justify-content:center}
.frame{position:relative;width:min(400px,88vw);aspect-ratio:3/4;border-radius:var(--r-full) var(--r-full) var(--r-md) var(--r-md);
  overflow:hidden;background:var(--c-surface);border:1px solid var(--c-line);box-shadow:var(--sh-lg);
  transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.frame img{width:100%;height:100%;object-fit:cover}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(16,12,8,.55))}
.stamp{position:absolute;right:-.75rem;bottom:2.5rem;background:var(--c-surface);border:1px solid var(--acc);color:var(--acc);
  padding:.55rem 1rem;border-radius:var(--r-sm);font:600 .72rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;
  transform:rotate(-4deg);box-shadow:var(--sh-md)}

/* ticker */
.ticker{width:min(1100px,92vw);overflow:hidden;border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line);padding:.7rem 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.tk{display:flex;gap:2.5rem;width:max-content;animation:tick 22s linear infinite;
  font-family:var(--f-display);font-size:1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--c-muted)}
.tk b{color:var(--c-gold);font-weight:400}
@keyframes tick{to{transform:translateX(-50%)}}

/* cta */
.cta{display:flex;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.6rem;padding:.95rem 2.2rem;
  border-radius:var(--r-full);font:600 .95rem var(--f-body);cursor:pointer;border:1px solid transparent;transition:.3s}
.btn svg{width:1.1rem;height:1.1rem}
.btn-gold{background:var(--c-gold);color:#1c130a}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(242,184,67,.35)}
.btn-ghost{border-color:var(--c-line);background:transparent}
.btn-ghost:hover{border-color:var(--c-gold);color:var(--c-gold)}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s}
.btn:hover::after{left:130%}
.info{display:flex;gap:1.5rem;margin-top:1.5rem;color:var(--c-muted);font-size:.85rem;flex-wrap:wrap}
.info span{display:inline-flex;align-items:center;gap:.45rem}
.info svg{width:.95rem;height:.95rem;color:var(--acc)}

/* front floaters */
.fl{position:absolute;opacity:.9;animation:float var(--fd,6s) ease-in-out var(--fdel,0s) infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-24px) rotate(8deg)}}

/* reveal */
.rev{opacity:0;transform:translateY(40px);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.scene.in .rev{opacity:1;transform:none}

/* overlays */
.vignette{position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,transparent 50%,rgba(10,7,4,.75) 100%),
  linear-gradient(180deg,rgba(14,10,6,.6),transparent 18%,transparent 80%,rgba(14,10,6,.7))}
#dust{position:fixed;inset:0;z-index:50;pointer-events:none;mix-blend-mode:screen}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;background:linear-gradient(180deg,rgba(14,10,6,.85),rgba(14,10,6,0))}
.brand{display:flex;align-items:baseline;gap:.75rem}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;letter-spacing:.06em;color:var(--c-gold)}
.brand span{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--c-muted)}
.links{display:flex;gap:2rem}
.links button{background:none;border:0;cursor:pointer;font:600 .8rem var(--f-body);letter-spacing:.15em;text-transform:uppercase;
  color:var(--c-muted);position:relative;padding:.25rem 0;transition:color .25s}
.links button::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--c-gold);transition:width .3s}
.links button:hover{color:var(--c-gold)}
.links button:hover::after{width:100%}
.acts{display:flex;align-items:center;gap:.75rem}
.btn-fly{width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--c-line);background:rgba(36,28,19,.7);
  display:grid;place-items:center;cursor:pointer;transition:.3s}
.btn-fly svg{width:1.05rem;height:1.05rem}
.btn-fly:hover{border-color:var(--c-gold);color:var(--c-gold)}
.btn-fly.on{border-color:var(--c-gold);color:var(--c-gold);box-shadow:0 0 16px rgba(242,184,67,.4);background:rgba(242,184,67,.12)}
.pill{background:none;border:1px solid var(--c-gold);color:var(--c-gold);padding:.5rem 1.4rem;border-radius:var(--r-full);
  font:600 .78rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.3s}
.pill:hover{background:var(--c-gold);color:#1c130a}

/* rail */
.rail{position:fixed;right:1.5rem;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:1.6rem;align-items:flex-end}
.rail::before{content:"";position:absolute;right:3.5px;top:-8px;bottom:-8px;width:1px;background:var(--c-line)}
.rail button{display:flex;align-items:center;gap:.7rem;background:none;border:0;cursor:pointer;padding:0}
.rail .lbl{font:600 .62rem var(--f-body);letter-spacing:.25em;text-transform:uppercase;color:var(--c-muted);
  opacity:0;transform:translateX(6px);transition:.3s}
.rail .dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--c-muted);transition:.3s}
.rail button:hover .lbl,.rail button.on .lbl{opacity:1;transform:none;color:var(--c-text)}
.rail button.on .dot{background:var(--c-gold);box-shadow:0 0 12px var(--c-gold);transform:scale(1.4)}

/* hud + hint */
.hud{position:fixed;left:2rem;bottom:2rem;z-index:90;display:flex;align-items:baseline;gap:.9rem}
.hud .idx{font-family:var(--f-display);font-size:2rem;color:var(--c-gold)}
.hud .zn{font:600 .7rem var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--c-muted)}
.hint{position:fixed;left:50%;bottom:1.75rem;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;align-items:center;gap:.6rem;
  color:var(--c-muted);font:600 .65rem var(--f-body);letter-spacing:.3em;text-transform:uppercase}
.hint .line{width:1px;height:44px;background:linear-gradient(var(--c-gold),transparent);position:relative;overflow:hidden}
.hint .line::after{content:"";position:absolute;left:0;top:-100%;width:100%;height:100%;
  background:linear-gradient(transparent,var(--c-gold));animation:drip 1.6s ease-in-out infinite}
@keyframes drip{to{top:100%}}

/* footer (reduced only) */
.footer{display:none}

/* reduced motion */
.reduced .runway{display:none}
.reduced .stage{position:static;height:auto;perspective:none;overflow:visible}
.reduced .world{position:static;transform:none!important}
.reduced .floor,.reduced #dust,.reduced .hint,.reduced .btn-fly,.reduced .gate,.reduced .ring{display:none}
.reduced .scene{position:relative;inset:auto;transform:none!important;opacity:1!important;visibility:visible!important;min-height:100vh;padding:6rem 0}
.reduced .l-mid{position:relative;inset:auto}
.reduced .l-back,.reduced .l-front{transform:none}
.reduced .ghost{font-size:clamp(5rem,18vw,9rem)}
.reduced .rev{transition:none;opacity:1;transform:none}
.reduced .footer{display:block;text-align:center;padding:3rem 1.5rem;color:var(--c-muted);font-size:.8rem;border-top:1px solid var(--c-line)}

/* mobile */
@media(max-width:820px){
  .nav{padding:.9rem 1.25rem}
  .brand span,.links{display:none}
  .mid{grid-template-columns:1fr;gap:2.5rem}
  .alt .mid{direction:ltr}
  .frame{width:min(300px,78vw)}
  .ghost{font-size:clamp(6rem,32vw,11rem)}
  .rail .lbl{display:none}
  .hud{left:1.25rem;bottom:1.25rem}
  .stamp{right:.25rem}
  .fl{display:none}
  .fl:nth-child(-n+2){display:block}
  .g-sign{display:none}
}
</style>
</head>

    <b>NUSA</b><span>Pasar Rasa Nusantara</span>

  <span class="line"></span>

<footer class="footer" id="footer"></footer>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#14100B;color:#F4EAD9">Aktifkan JavaScript untuk pengalaman 3D.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
<script>
const { animate } = Motion;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SPACING=1600, N=DATA.scenes.length;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine=matchMedia('(pointer: fine)').matches;

/* runway */
const runway=$('#runway');
runway.style.height=(N*130)+'vh';
let maxScroll=1;
const onResize=()=>{maxScroll=Math.max(1,runway.offsetHeight-innerHeight)};
onResize(); addEventListener('resize',onResize);

/* floaters */
const F=[
  {s:26,x:'7%', y:'16%',bg:'var(--c-gold)', r:'50%',fd:'7s', d:'0s'},
  {s:14,x:'88%',y:'22%',bg:'var(--acc)',    r:'50%',fd:'5s', d:'-2s'},
  {s:34,x:'85%',y:'72%',bg:'var(--acc)',    r:'0 50% 0 50%',fd:'8s',d:'-1s'},
  {s:10,x:'11%',y:'78%',bg:'var(--c-ember)',r:'50%',fd:'6s', d:'-3s'},
  {s:18,x:'72%',y:'9%', bg:'',bd:'1.5px solid var(--acc)',r:'50%',fd:'9s',d:'-4s'}
];
const floaters=()=>F.map(f=>`<span class="fl" style="width:${f.s}px;height:${f.s}px;left:${f.x};top:${f.y};${f.bd?'border:'+f.bd+';':'background:'+f.bg+';'}border-radius:${f.r};--fd:${f.fd};--fdel:${f.d}"></span>`).join('');

const pin=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
const clock=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
